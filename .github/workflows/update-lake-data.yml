name: Update Lake Data

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours starting at 00:00 UTC
  workflow_dispatch:      # Allows manual trigger
  push:
    paths:
      - 'data/**/*.json'  # Run when JSON files are updated
      - '.github/workflows/**'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # Required for pushing changes
      issues: write      # Required for creating issues on failure
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Configure Git
      run: |
        git config user.name 'Kakahaja07'
        git config user.email 'kakahaja07@gmail.com'

    - name: Check Current Data
      id: check_current
      run: |
        if [ -f "data/lake_levels.json" ]; then
          CURRENT_TIMESTAMP=$(jq -r '.metadata.lastUpdated' data/lake_levels.json || echo "")
          echo "current_timestamp=$CURRENT_TIMESTAMP" >> $GITHUB_OUTPUT
        fi

    - name: Run Lake Data Update
      id: update_data
      run: |
        node lakeScraper.js
        
        if [ -f "data/lake_levels.json" ]; then
          NEW_TIMESTAMP=$(jq -r '.metadata.lastUpdated' data/lake_levels.json || echo "")
          
          if [ "${{ steps.check_current.outputs.current_timestamp }}" = "$NEW_TIMESTAMP" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No new data available. Skipping update."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "New data detected. Proceeding with update."
          fi
        else
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "Initial data creation."
        fi

    - name: Create Summary
      run: |
        echo "## Lake Data Update Summary" >> $GITHUB_STEP_SUMMARY
        echo "🕒 Update Time: $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ steps.update_data.outputs.no_changes }}" = "true" ]; then
          echo "ℹ️ No new data available - skipped update" >> $GITHUB_STEP_SUMMARY
        else
          echo "✅ New data detected and processed" >> $GITHUB_STEP_SUMMARY
        fi
        
        # List all JSON files
        echo "### JSON Files in Repository:" >> $GITHUB_STEP_SUMMARY
        find . -name "*.json" -type f >> $GITHUB_STEP_SUMMARY

    - name: Commit and push if changed
      if: steps.update_data.outputs.changes == 'true'
      run: |
        # Get current date for commit message
        DATE=$(date '+%Y-%m-%d')
        
        # Create commit message
        echo "Lake Data Update $DATE" > commit_msg.txt
        echo "" >> commit_msg.txt
        echo "Modified files:" >> commit_msg.txt
        git diff --cached --name-status >> commit_msg.txt

        # Stage and commit changes
        git add data/ history/
        git commit -F commit_msg.txt
        git push

    - name: Notify on Failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const issue = await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `⚠️ Lake Data Update Failed - ${new Date().toISOString().split('T')[0]}`,
            body: `The automated lake data update failed. Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`
          });